name: release

# A signed release APK published as a GitHub Release (docs/RELEASE.md).
# Runs when a version tag is pushed (v0.3.0) or by hand; needs the four SABOU_* signing secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release and attach the APK

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SABOU_KEYSTORE_B64: ${{ secrets.SABOU_KEYSTORE_B64 }}
      SABOU_KEYSTORE_PASSWORD: ${{ secrets.SABOU_KEYSTORE_PASSWORD }}
      SABOU_KEY_ALIAS: ${{ secrets.SABOU_KEY_ALIAS }}
      SABOU_KEY_PASSWORD: ${{ secrets.SABOU_KEY_PASSWORD }}
    steps:
      - name: Signing secrets are set
        shell: bash
        run: |
          missing=""
          for v in SABOU_KEYSTORE_B64 SABOU_KEYSTORE_PASSWORD SABOU_KEY_ALIAS SABOU_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions; see docs/RELEASE.md)"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Version
        id: version
        shell: bash
        run: |
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)
          code=$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # A tag must match the version it releases.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$name" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION_NAME $name in version.properties"
            exit 1
          fi
      - name: Test, then build and sign
        shell: bash
        run: |
          set -o pipefail
          export SABOU_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$SABOU_KEYSTORE_B64" | base64 -d > "$SABOU_KEYSTORE_PATH"
          trap 'rm -f "$SABOU_KEYSTORE_PATH"' EXIT
          ./gradlew --no-daemon --stacktrace domainBuild :app:assembleRelease
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out
          cp "$apk" "out/sabou-${{ steps.version.outputs.name }}.apk"
          # The certificate fingerprint people can compare before installing an update.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs "out/sabou-${{ steps.version.outputs.name }}.apk" | tee out/signature.txt
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sabou-${{ steps.version.outputs.name }}
          path: out/*
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/*.apk out/SHA256SUMS.txt \
            --title "Sabou ${{ steps.version.outputs.name }}" \
            --notes "نسخه‌ی ${{ steps.version.outputs.name }} (کد ${{ steps.version.outputs.code }}). پیش از نصب، اثر امضای فایل را با نسخه‌ی قبلی مقایسه کنید (signature در خروجی اجرا)."
