name: tmp-pg-meta
on:
  push:
    branches: [claude/tmp-pg-meta]
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --write-verification-metadata sha256 --dry-run :modules:core:dependencies --configuration testRuntimeClasspath :modules:core:testClasses || true
      - run: |
          mkdir -p /tmp/m && cp gradle/verification-metadata.dryrun.xml /tmp/m/ && cd /tmp/m
          git init -q && git checkout -q -b ci-meta-pg && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "dry-run metadata ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-meta-pg
