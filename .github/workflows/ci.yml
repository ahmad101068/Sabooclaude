name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write   # only used to publish failure logs to the ci-logs branch

# ubuntu-latest runners ship the Android SDK (ANDROID_HOME); AGP installs missing platforms itself.

jobs:
  domain:
    name: Domain, persistence and core (JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build and test domain modules
        shell: bash
        env:
          # Volume guard (ADR-0027): 90 days of a busy restaurant, then the reads people wait for.
          SABOU_BENCH: "90"
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace domainBuild 2>&1 | tee domain-build.log
      - name: Publish failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          { echo "domain run ${{ github.run_id }} sha ${{ github.sha }}"; grep -E '^e: |error:|What went wrong|FAILED|Dependency verification failed' -A6 "$GITHUB_WORKSPACE/domain-build.log" | head -300; echo; echo '--- tail ---'; tail -120 "$GITHUB_WORKSPACE/domain-build.log"; } > errors.txt
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "domain log ${{ github.run_id }}"
          # Diagnostics only: retried, and never the reason a build fails (reports are also uploaded as artifacts).
          for attempt in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs && break; sleep $((attempt * 5)); done || true
      - name: Upload test reports
        if: always()
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: domain-test-reports
          path: "modules/**/build/reports/tests/**"
          if-no-files-found: ignore

  postgres:
    name: Domain tests on PostgreSQL (server path, ADR-0060)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sabou
          POSTGRES_PASSWORD: postgres
          # Throwaway service: tenant roles log in without passwords (TenantIsolationTest creates them).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Same suite, every store on PostgreSQL
        shell: bash
        env:
          SABOU_DB: postgres
          SABOU_PG_URL: "jdbc:postgresql://localhost:5432/sabou?user=postgres"
        run: ./gradlew --no-daemon --stacktrace domainBuild
      - name: Upload test reports
        if: always()
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: postgres-test-reports
          path: "modules/**/build/reports/tests/**"
          if-no-files-found: ignore

  android:
    name: Android app (compile, lint, debug APK)
    runs-on: ubuntu-latest
    needs: domain
    timeout-minutes: 45
    env:
      # Only the presence check lives at job level: the debug build must not see a partial signing setup.
      SABOU_KEYSTORE_B64: ${{ secrets.SABOU_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Assemble and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee android-build.log
      - name: Publish failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          { echo "run ${{ github.run_id }} sha ${{ github.sha }}"; grep -E '^e: |^w: .*error|error:|What went wrong' -A3 "$GITHUB_WORKSPACE/android-build.log" | head -400; echo; echo '--- tail ---'; tail -150 "$GITHUB_WORKSPACE/android-build.log"; } > errors.txt
          cp "$GITHUB_WORKSPACE"/app/build/reports/lint-results-debug.txt . 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "android log ${{ github.run_id }}"
          # Diagnostics only: retried, and never the reason a build fails (reports are also uploaded as artifacts).
          for attempt in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs && break; sleep $((attempt * 5)); done || true
      - name: Upload debug APK
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: sabou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # The real app, signed with the owner's private key. Runs only when the four signing secrets exist
      # (Settings → Secrets and variables → Actions); the key never enters the repository.
      - name: Signed release APK
        if: env.SABOU_KEYSTORE_B64 != ''
        shell: bash
        env:
          SABOU_KEYSTORE_PASSWORD: ${{ secrets.SABOU_KEYSTORE_PASSWORD }}
          SABOU_KEY_ALIAS: ${{ secrets.SABOU_KEY_ALIAS }}
          SABOU_KEY_PASSWORD: ${{ secrets.SABOU_KEY_PASSWORD }}
        run: |
          set -o pipefail
          export SABOU_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$SABOU_KEYSTORE_B64" | base64 -d > "$SABOU_KEYSTORE_PATH"
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee release-build.log
          rm -f "$SABOU_KEYSTORE_PATH"
      - name: Upload release APK
        if: env.SABOU_KEYSTORE_B64 != ''
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: sabou-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Upload lint report
        if: always()
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  device:
    name: Android device tests (emulator)
    # Pinned: since ubuntu-latest moved to Ubuntu 26 (Oct 2026) the emulator times out booting there.
    runs-on: ubuntu-24.04
    needs: android
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests (SQLCipher, Keystore, backup/restore, drafts, every page)
        # Its own limit, under the job's: a hang still leaves time to publish what happened.
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # While the verification metadata is missing (being regenerated), record it here too: this run
          # also resolves the device-test toolchain that the other jobs never download.
          script: bash scripts/ci_device_tests.sh
      - name: Publish device test results to ci-device branch
        if: always()
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p /tmp/dev && cd /tmp/dev
          cp "$GITHUB_WORKSPACE"/device-tests.log . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE"/gradle/verification-metadata.xml ./verification-metadata.xml 2>/dev/null || true
          find "$GITHUB_WORKSPACE"/app/build/outputs/androidTest-results -name '*.xml' -exec cp {} . \; 2>/dev/null || true
          find "$GITHUB_WORKSPACE"/app/build/outputs/androidTest-results -name 'logcat*' -exec cp {} . \; 2>/dev/null || true
          echo "run ${{ github.run_id }} sha ${{ github.sha }} status ${{ job.status }}" > README.txt
          # Why an emulator did not boot, when it did not: the host, KVM, disk, the emulator and its log.
          {
            uname -a; cat /etc/os-release | head -3; nproc; free -m; df -h / | tail -1
            ls -l /dev/kvm 2>&1; groups
            timeout 20 "$ANDROID_HOME"/emulator/emulator -version 2>&1 | head -2
            timeout 20 "$ANDROID_HOME"/emulator/emulator -accel-check 2>&1 | tail -3
            ls "$ANDROID_HOME"/system-images/*/* 2>&1; ls ~/.android/avd 2>&1
            timeout 10 "$ANDROID_HOME"/platform-tools/adb devices 2>&1
            timeout 10 "$ANDROID_HOME"/platform-tools/adb shell getprop sys.boot_completed 2>&1
            timeout 20 "$ANDROID_HOME"/platform-tools/adb logcat -d 2>&1 | tail -150
          } > host.txt 2>&1 || true
          git init -q && git checkout -q -b ci-device
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "device tests ${{ github.run_id }}"
          # Diagnostics only: retried, and never the reason a build fails (reports are also uploaded as artifacts).
          for attempt in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-device && break; sleep $((attempt * 5)); done || true
      - name: Upload device test reports
        if: always()
        # Diagnostics only: a full artifact quota must not fail a green build.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: device-test-reports
          path: app/build/reports/androidTests/**
          if-no-files-found: ignore

  dependency-verification:
    name: Dependency verification metadata (generated only while it is missing)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Generate and publish (skipped once the file is committed)
        shell: bash
        run: |
          if [ -f gradle/verification-metadata.xml ]; then echo "metadata present; Gradle verifies every artifact"; exit 0; fi
          ./gradlew --no-daemon --write-verification-metadata sha256 domainBuild :app:assembleDebug :app:assembleRelease :app:lintDebug :app:assembleDebugAndroidTest
          mkdir -p /tmp/meta && cp gradle/verification-metadata.xml /tmp/meta/ && cd /tmp/meta
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "verification metadata ${{ github.run_id }}"
          # Diagnostics only: retried, and never the reason a build fails (reports are also uploaded as artifacts).
          for attempt in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs && break; sleep $((attempt * 5)); done || true
