name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write   # only used to publish failure logs to the ci-logs branch

# ubuntu-latest runners ship the Android SDK (ANDROID_HOME); AGP installs missing platforms itself.

jobs:
  domain:
    name: Domain, persistence and core (JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Build and test domain modules
        run: ./gradlew --no-daemon --stacktrace domainBuild
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-reports
          path: "modules/**/build/reports/tests/**"
          if-no-files-found: ignore

  android:
    name: Android app (compile, lint, debug APK)
    runs-on: ubuntu-latest
    needs: domain
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Assemble and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee android-build.log
      - name: Publish failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          { echo "run ${{ github.run_id }} sha ${{ github.sha }}"; grep -E '^e: |^w: .*error|error:|What went wrong' -A3 "$GITHUB_WORKSPACE/android-build.log" | head -400; echo; echo '--- tail ---'; tail -150 "$GITHUB_WORKSPACE/android-build.log"; } > errors.txt
          cp "$GITHUB_WORKSPACE"/app/build/reports/lint-results-debug.txt . 2>/dev/null || true
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "android log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sabou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  dependency-verification:
    name: Generate dependency verification metadata (only while it is missing)
    if: hashFiles('gradle/verification-metadata.xml') == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Resolve everything and record SHA-256 of every artifact
        run: ./gradlew --no-daemon --write-verification-metadata sha256 domainBuild :app:assembleDebug :app:assembleRelease :app:lintDebug
      - name: Publish metadata to the ci-logs branch
        shell: bash
        run: |
          mkdir -p /tmp/meta && cp gradle/verification-metadata.xml /tmp/meta/ && cd /tmp/meta
          git init -q && git checkout -q -b ci-logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "verification metadata ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
