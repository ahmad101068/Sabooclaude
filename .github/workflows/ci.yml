name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

# ubuntu-latest runners ship the Android SDK (ANDROID_HOME); AGP installs missing platforms itself.

jobs:
  domain:
    name: Domain, persistence and core (JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test domain modules
        run: ./gradlew --no-daemon --stacktrace domainBuild
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-reports
          path: "modules/**/build/reports/tests/**"
          if-no-files-found: ignore

  android:
    name: Android app (compile, lint, debug APK)
    runs-on: ubuntu-latest
    needs: domain
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble and lint
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sabou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
